# ============================================================
# MetaPool — Prometheus 告警规则（2.4，覆盖全部六类资源）
# 基于治理控制面实际导出的指标：
#   metapool_datasource_* / metapool_ratelimiter_* / metapool_executor_*
#   metapool_lock_*       / metapool_object_*      / metapool_redis_*  / metapool_memory_*
#
# 两条贯穿始终的口径：
#
# 1. 只在「有人受影响」时才告警。资源用满不算故障 —— 连接池借满、线程池跑满、对象池借光，
#    都可能正是它在满负荷工作。所以饱和类一律要求「同时有等待者 / 已产生拒绝」。
#
# 2. 重点盯【底层库替你隐藏起来的问题】。这类问题不埋告警就基本不可能被发现：
#    · LockLeaseExpired    锁被悄悄抢走（看门狗被禁用的直接后果）
#    · RedisReconnecting   自动重连掩盖了网络抖动，业务只觉得「偶尔慢一下」
#    · OffHeapBufferLeak   堆外泄漏不占堆、GC 管不着，不 OOM 就没人知道
#
# ⚠️ 新增 adapter 后记得回来补规则：指标有了而告警没跟上，等于白埋点。
# ============================================================

groups:
  - name: metapool-alerts
    rules:
      # ── 1. 连接池饱和：有线程在等待获取连接 ──
      - alert: DatasourcePendingHigh
        expr: metapool_datasource_connections_pending > 5
        for: 1m
        labels:
          severity: critical
          category: datasource
        annotations:
          summary: "MetaPool 连接池饱和 — 有请求在排队等待连接"
          description: >
            数据源 {{ $labels.metapool_resource }} 的等待获取连接的线程数达 {{ $value }}，
            持续超过 1 分钟。请检查 maximum-pool-size（可经 /actuator/metapool 热调）或下游数据库健康。

      # ── 2. 连接池无空闲：空闲连接为 0 且总连接已达峰 ──
      - alert: DatasourceNoIdle
        expr: metapool_datasource_connections_idle == 0 and metapool_datasource_connections_pending > 0
        for: 2m
        labels:
          severity: warning
          category: datasource
        annotations:
          summary: "MetaPool 连接池长时间无空闲连接"
          description: >
            数据源 {{ $labels.metapool_resource }} 已 2 分钟无空闲连接且有等待者。
            考虑热调 maximum-pool-size 或排查慢查询。

      # ── 3. 限流持续拒绝：说明流量超过配额 ──
      - alert: RateLimiterRejecting
        expr: sum by (metapool_resource) (rate(metapool_ratelimiter_rejected_total[5m])) > 0
        for: 2m
        labels:
          severity: warning
          category: rate-limiter
        annotations:
          summary: "MetaPool 限流器持续拒绝请求"
          description: >
            限流器 {{ $labels.metapool_resource }} 在过去 5 分钟持续产生拒绝。
            若为预期削峰可忽略；否则考虑热调 limit-for-period（/actuator/metapool）。

      # ── 4. 线程池饱和：已在拒绝任务 ──
      # 只看队列深度会误报（深队列本就是设计意图），拒绝才是真的丢任务。
      - alert: ExecutorRejecting
        expr: sum by (metapool_resource) (rate(metapool_executor_rejected_total[5m])) > 0
        for: 2m
        labels:
          severity: critical
          category: executor
        annotations:
          summary: "MetaPool 线程池正在拒绝任务"
          description: >
            线程池 {{ $labels.metapool_resource }} 在过去 5 分钟持续拒绝任务，说明已经饱和。
            处置：热调 core-pool-size / maximum-pool-size（/actuator/metapool），或排查任务变慢的原因。
            注意若配的是无界队列，maximum-pool-size 不会生效，此时应先改为有界队列。

      # ── 5. 线程池队列积压：领先指标，先于拒绝出现 ──
      - alert: ExecutorQueueBacklog
        expr: metapool_executor_queue_size > 0 and metapool_executor_active >= metapool_executor_pool_size
        for: 5m
        labels:
          severity: warning
          category: executor
        annotations:
          summary: "MetaPool 线程池队列持续积压"
          description: >
            线程池 {{ $labels.metapool_resource }} 已 5 分钟队列非空且线程全忙（当前队列 {{ $value }}）。
            这是「快要撑不住」的领先指标——等 rejected 曲线起来时任务已经在丢了。

      # ── 6. 🔴 分布式锁租约到期：可能已有两个进程同时进临界区 ──
      # 这是 redisson 适配器最该被盯住的一条。MetaPool 的 DistributedLock 要求 leaseTime 必填，
      # 因而 Redisson 的看门狗不启用（不自动续期）；业务跑过租约就会被别人抢走锁，
      # 而契约又不提供 fencing token，下游无法拒绝过期持有者的迟到写入。
      # 详见 docs/design/adapter-redisson.md。
      - alert: LockLeaseExpired
        expr: sum by (metapool_resource) (rate(metapool_lock_lease_expired_total[5m])) > 0
        for: 1m
        labels:
          severity: critical
          category: lock
        annotations:
          summary: "MetaPool 分布式锁租约到期 — 临界区可能已被并发进入"
          description: >
            锁 {{ $labels.metapool_resource }} 出现租约到期：业务执行时间超过了 leaseTime，
            锁已自动释放，另一进程可能已持有同一把锁。正常情况下该值应恒为 0。
            处置：调大 leaseTime（建议为业务耗时的 3~5 倍）或缩短临界区；
            若临界区无法缩短且不能容忍并发，应改用存储层互斥（唯一约束 / 乐观锁版本号）。

      # ── 7. 分布式锁竞争激烈：大量获取超时 ──
      - alert: LockAcquireTimeoutHigh
        expr: sum by (metapool_resource) (rate(metapool_lock_timeout_total[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
          category: lock
        annotations:
          summary: "MetaPool 分布式锁获取超时频繁"
          description: >
            锁 {{ $labels.metapool_resource }} 在过去 5 分钟平均每秒超过 0.5 次获取失败。
            要么临界区太长，要么锁粒度太粗（考虑按更细的 key 拆分）。

      # ── 8. 🔴 Redis 连接反复重连：Lettuce 自动重连把网络抖动掩盖了 ──
      # 业务侧只会觉得「偶尔慢一下」，没有任何人知道底下在反复重连。
      # 不埋这条告警，这个问题在生产上基本不可能被发现。
      - alert: RedisReconnecting
        expr: sum by (metapool_resource) (rate(metapool_redis_disconnects_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
          category: redis
        annotations:
          summary: "MetaPool Redis 连接反复断开重连"
          description: >
            Redis 资源 {{ $labels.metapool_resource }} 在过去 5 分钟持续出现断连。
            Lettuce 会自动重连，所以业务多半只表现为偶发变慢——但链路确实在抖。
            排查方向：网络、Redis 侧的 timeout / maxmemory 驱逐、或中间的负载均衡器空闲超时。

      # ── 9. Redis 连接长时间不可用 ──
      # 注意判据是「持续」5 分钟：短暂掉线是自动重连的正常过程，不该告警。
      - alert: RedisConnectionDown
        expr: metapool_redis_connection_open == 0
        for: 5m
        labels:
          severity: critical
          category: redis
        annotations:
          summary: "MetaPool Redis 连接已持续 5 分钟未恢复"
          description: >
            Redis 资源 {{ $labels.metapool_resource }} 的连接持续 5 分钟处于断开状态，
            自动重连没能恢复它。此时 MetaPool 的健康状态为 DEGRADED（若关闭了 auto-reconnect 则为 DOWN）。

      # ── 10. 🔴 堆外内存疑似泄漏：借出与释放的速率持续不匹配 ──
      # 堆外泄漏不占堆、GC 管不着，不 OOM 就没人知道。这条告警就是为了让它当天可见。
      # 判据用速率差而不是绝对数：短时间的借多还少是正常的（buf 正在被使用）。
      - alert: OffHeapBufferLeak
        expr: >
          sum by (metapool_resource) (rate(metapool_memory_allocated_total[10m]))
          - sum by (metapool_resource) (rate(metapool_memory_released_total[10m])) > 0.1
        for: 15m
        labels:
          severity: critical
          category: memory
        annotations:
          summary: "MetaPool 堆外内存疑似泄漏 —— 借出与释放持续不匹配"
          description: >
            内存池 {{ $labels.metapool_resource }} 在过去 15 分钟里，ByteBuf 的分配速率持续高于释放速率。
            这几乎总是意味着某条代码路径忘了 release（注意 Netty 的 release 是引用计数减一，
            retain() 过的 buf 需要对应次数的 release）。
            排查：对照看板上 allocated / released 两条曲线的分叉起点，定位那个时间点上线的改动。

      # ── 11. 对象池耗尽：借光且有人排队 ──
      - alert: ObjectPoolExhausted
        expr: metapool_object_pending > 0 and metapool_object_idle == 0
        for: 2m
        labels:
          severity: warning
          category: object
        annotations:
          summary: "MetaPool 对象池耗尽 — 有线程在排队等待借出"
          description: >
            对象池 {{ $labels.metapool_resource }} 已 2 分钟无空闲对象且有 {{ $value }} 个等待者。
            处置：热调 max-total（/actuator/metapool），或排查是否有对象借出后未归还
            （对照看板上 borrowed / released 两条速率曲线是否分叉）。

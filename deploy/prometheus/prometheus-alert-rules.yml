# ============================================================
# MetaPool — Prometheus 告警规则（2.0）
# 基于治理控制面实际导出的指标（metapool_datasource_* / metapool_ratelimiter_*）
# ============================================================

groups:
  - name: metapool-alerts
    rules:
      # ── 1. 连接池饱和：有线程在等待获取连接 ──
      - alert: DatasourcePendingHigh
        expr: metapool_datasource_connections_pending > 5
        for: 1m
        labels:
          severity: critical
          category: datasource
        annotations:
          summary: "MetaPool 连接池饱和 — 有请求在排队等待连接"
          description: >
            数据源 {{ $labels.metapool_resource }} 的等待获取连接的线程数达 {{ $value }}，
            持续超过 1 分钟。请检查 maximum-pool-size（可经 /actuator/metapool 热调）或下游数据库健康。

      # ── 2. 连接池无空闲：空闲连接为 0 且总连接已达峰 ──
      - alert: DatasourceNoIdle
        expr: metapool_datasource_connections_idle == 0 and metapool_datasource_connections_pending > 0
        for: 2m
        labels:
          severity: warning
          category: datasource
        annotations:
          summary: "MetaPool 连接池长时间无空闲连接"
          description: >
            数据源 {{ $labels.metapool_resource }} 已 2 分钟无空闲连接且有等待者。
            考虑热调 maximum-pool-size 或排查慢查询。

      # ── 3. 限流持续拒绝：说明流量超过配额 ──
      - alert: RateLimiterRejecting
        expr: sum by (metapool_resource) (rate(metapool_ratelimiter_rejected_total[5m])) > 0
        for: 2m
        labels:
          severity: warning
          category: rate-limiter
        annotations:
          summary: "MetaPool 限流器持续拒绝请求"
          description: >
            限流器 {{ $labels.metapool_resource }} 在过去 5 分钟持续产生拒绝。
            若为预期削峰可忽略；否则考虑热调 limit-for-period（/actuator/metapool）。
